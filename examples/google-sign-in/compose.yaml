# Self-hosted Tasks with Google sign-in, SQLite and filesystem storage.
#   cp tasks.env.example tasks.env   # then edit tasks.env
#   docker compose up --build
# The application listens on http://localhost:8080.
services:
  tasks:
    build:
      context: ../..
    image: tasks:local
    env_file: ./tasks.env
    ports:
      - "8080:8080"
    volumes:
      - tasks-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  tasks-data:
